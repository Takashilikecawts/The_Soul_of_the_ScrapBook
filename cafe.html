<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Soul of the Scrapbook - Café</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="topbar">

    <h1>The Soul of the Scrapbook</h1>

    <div class="coins">
      🪙 <span id="coinDisplay">0</span>
    </div>

  </header>


  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <nav class="main-nav">

    <a href="index.html">Home</a>

    <a href="cafe.html">Café</a>

    <a href="scrapbook.html">Scrapbook</a>

    <a href="Shop.html">Shop</a>

    <a href="afterlife.html">Afterlife</a>

  </nav>


  <!-- =====================================================
       MAIN CONTENT
  ====================================================== -->

  <main class="page-container">

    <h2 class="section-title">
      The Soul Café
    </h2>


    <!-- ===================================================
         CAFÉ ROOM
    ==================================================== -->

    <section class="cafe-room">

      <!-- Main café picture -->

      <img
        src="images/cafe.png"
        class="cafe-background"
        alt="Pixel art café""
      >


      <!-- Café sign -->

      <div class="cafe-sign">
        The Soul of the Scrapbook
      </div>


      <!-- Purchased/equipped accessories appear here -->

      <div id="accessoryDisplay"></div>

    </section>


    <!-- ===================================================
         CUSTOMER MINI GAME
    ==================================================== -->

    <section class="mini-game">

      <h2>Welcome to the Café</h2>

      <p>
        Serve the customer their requested drink.
      </p>


      <!-- Customer appears here -->

      <div id="customerOrder">
        Loading...
      </div>


      <!-- Menu buttons -->

      <div id="menuButtons"></div>


      <!-- Result -->

      <p id="gameResult"></p>

    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       GAME DATA
    ====================================================== */

    const orders = [

      {
        name: "Coffee",
        icon: "☕",
        reward: 100
      },

      {
        name: "Tea",
        icon: "🍵",
        reward: 120
      },

      {
        name: "Hot Chocolate",
        icon: "🍫",
        reward: 150
      },

      {
        name: "Strawberry Milk",
        icon: "🍓",
        reward: 130
      },

      {
        name: "Matcha",
        icon: "🍵",
        reward: 180
      },

      {
        name: "Lemon Tea",
        icon: "🍋",
        reward: 140
      }

    ];


    /* =====================================================
       GAME STATE
    ====================================================== */

    function getGame() {

      const saved =
        localStorage.getItem("soulScrapbookGame");

      if (saved) {

        return JSON.parse(saved);

      }


      const newGame = {

        coins: 0,

        equippedTheme: "cozy",

        ownedThemes: ["cozy"],

        ownedAccessories: [],

        equippedAccessories: []

      };


      localStorage.setItem(
        "soulScrapbookGame",
        JSON.stringify(newGame)
      );


      return newGame;

    }


    function saveGame(game) {

      localStorage.setItem(
        "soulScrapbookGame",
        JSON.stringify(game)
      );

    }


    /* =====================================================
       COINS
    ====================================================== */

    function updateCoins() {

      const game = getGame();

      const coinDisplay =
        document.getElementById("coinDisplay");

      if (coinDisplay) {

        coinDisplay.textContent = game.coins;

      }

    }


    /* =====================================================
       CUSTOMER ORDER
    ====================================================== */

    let currentOrder;


    function newOrder() {

      currentOrder =
        orders[
          Math.floor(
            Math.random() * orders.length
          )
        ];


      const customerOrder =
        document.getElementById("customerOrder");


      customerOrder.innerHTML = `

        <div class="customer">

          <div class="customer-face">

            <img
              src="images/cat.png"
              alt="Café customer"
              onerror="this.style.display='none'"
            >

          </div>

          <p>
            I'd like a
            <strong>
              ${currentOrder.icon}
              ${currentOrder.name}
            </strong>
            please!
          </p>

        </div>

      `;


      createMenu();

    }


    /* =====================================================
       MENU
    ====================================================== */

    function createMenu() {

      const menu =
        document.getElementById("menuButtons");

      menu.innerHTML = "";


      /* Shuffle the orders */

      const choices = [...orders]
        .sort(() => Math.random() - 0.5)
        .slice(0, 4);


      /* Make sure the correct answer is included */

      if (
        !choices.some(
          item => item.name === currentOrder.name
        )
      ) {

        choices[
          Math.floor(
            Math.random() * choices.length
          )
        ] = currentOrder;

      }


      choices.forEach(item => {

        const button =
          document.createElement("button");

        button.className = "menu-item";

        button.innerHTML = `
          ${item.icon}
          ${item.name}
        `;


        button.onclick = () => {

          serveCustomer(item);

        };


        menu.appendChild(button);

      });

    }


    /* =====================================================
       SERVE CUSTOMER
    ====================================================== */

    function serveCustomer(item) {

      const result =
        document.getElementById("gameResult");


      const game = getGame();


      if (item.name === currentOrder.name) {

        game.coins += currentOrder.reward;

        saveGame(game);

        updateCoins();


        result.innerHTML =
          `Correct! You earned ${currentOrder.reward} coins.`;


        setTimeout(() => {

          result.innerHTML = "";

          newOrder();

        }, 1200);


      } else {

        result.innerHTML =
          "That's not what the customer ordered!";


        setTimeout(() => {

          result.innerHTML = "";

        }, 1200);

      }

    }


    /* =====================================================
       ACCESSORIES
    ====================================================== */

    const accessoryImages = {

      flowers:
        "images/flowers.png",

      bookshelf:
        "images/bookshelf.png",

      teddy:
        "images/teddy.png",

      polaroids:
        "images/polaroids.png",

      plant:
        "images/plant.png",

      ghostlamp:
        "images/ghostlamp.png"

    };


    function renderAccessories() {

      const game = getGame();

      const display =
        document.getElementById(
          "accessoryDisplay"
        );


      display.innerHTML = "";


      game.equippedAccessories.forEach(
        id => {

          if (!accessoryImages[id]) {
            return;
          }


          const img =
            document.createElement("img");


          img.src =
            accessoryImages[id];


          img.className =
            "cafe-accessory";


          img.alt =
            id;


          img.onerror =
            function() {

              this.style.display = "none";

            };


          display.appendChild(img);

        }
      );

    }


    /* =====================================================
       THEME
    ====================================================== */

    function applyTheme() {

      const game = getGame();


      /* Remove old theme classes */

      document.body.classList.remove(
        "theme-cozy",
        "theme-rainy",
        "theme-garden",
        "theme-vintage",
        "theme-midnight",
        "theme-afterlife"
      );


      /* Add current theme */

      document.body.classList.add(
        "theme-" + game.equippedTheme
      );

    }


    /* =====================================================
       START GAME
    ====================================================== */

    function startCafe() {

      applyTheme();

      updateCoins();

      renderAccessories();

      newOrder();

    }


    startCafe();

  </script>

</body>
</html>
