<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>My Café</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header class="topbar">

<h1>☕ My Café</h1>

<div class="coins">
✦ <span class="coin-count">0</span>
</div>

</header>


<nav class="main-nav">

<a href="index.html">Home</a>

<a href="cafe.html">My Café</a>

<a href="scrapbook.html">Scrapbook</a>

<a href="Shop.html">Shop</a>

<a href="afterlife.html">Truth</a>

</nav>


<main class="page-container">


<h1 class="section-title">
Your Café
</h1>


<!-- CAFÉ -->

<section class="cafe-room">

<div class="cafe-sign">
The Soul of the Scrapbook
</div>


<!--

IMAGE TEMPLATE

Replace this entire div with:

<img
src="images/cafe.png"
class="cafe-background"
>

-->

<div class="cafe-background-placeholder">

YOUR CAFÉ IMAGE

</div>


<!-- SHOP ACCESSORIES APPEAR HERE -->

<div id="accessoryDisplay"></div>

</section>


<!-- CUSTOMER GAME -->

<section class="mini-game">

<h2>
Today's Customer
</h2>


<div id="customerOrder">

Loading...

</div>


<p>
Choose what the customer ordered:
</p>


<div id="menuButtons"></div>


<br>


<button
class="btn secondary"
onclick="createCustomer()"
>
New Customer
</button>

</section>


<!-- QUICK LINKS -->

<section class="paper center">

<h2>
Your Café
</h2>

<br>

<p>
Memories:
<strong id="memoryCount">0</strong>
</p>

<br>

<a
href="scrapbook.html"
class="btn"
>
Write a Memory
</a>

</section>


</main>


<script>

/* =========================================================
GAME DATA
========================================================= */

const defaultGame = {

coins: 0,

memories: [],

unlockedThemes: ["cozy"],

ownedAccessories: [],

equippedTheme: "cozy",

equippedAccessories: [],

milestones: [],

afterlifeUnlocked: false

};


function getGame() {

const saved =
localStorage.getItem(
"soulScrapbookGame"
);

if (!saved) {

localStorage.setItem(
"soulScrapbookGame",
JSON.stringify(defaultGame)
);

return structuredClone(defaultGame);

}

return JSON.parse(saved);
}


function saveGame(game) {

localStorage.setItem(
"soulScrapbookGame",
JSON.stringify(game)
);

}


/* =========================================================
COINS
========================================================= */

function addCoins(amount) {

const game = getGame();

game.coins += amount;

checkMilestones(game);

saveGame(game);

updateUI();

}


/* =========================================================
MILESTONES
========================================================= */

const milestones = [

[
1000,
"Something about this café feels strangely familiar."
],

[
5000,
"A scrapbook page appears that you don't remember writing."
],

[
10000,
"One of your companions seems to remember you."
],

[
25000,
"You remember something about the day of the accident."
],

[
50000,
"The café doesn't feel like a place you own anymore."
],

[
75000,
"You finally realize the accident may be connected to the café."
],

[
100000,
"You remember everything. You never woke up."
]

];


function checkMilestones(game) {

milestones.forEach(([amount, message]) => {

if (
game.coins >= amount &&
!game.milestones.includes(amount)
) {

game.milestones.push(amount);

saveGame(game);

showMemoryMessage(
message
);

}

});


if (
game.coins >= 100000 &&
!game.afterlifeUnlocked
) {

game.afterlifeUnlocked = true;

if (
!game.unlockedThemes.includes(
"afterlife"
)
) {

game.unlockedThemes.push(
"afterlife"
);

}

saveGame(game);

setTimeout(
showEnding,
800
);

}

}


/* =========================================================
POPUP
========================================================= */

function showMemoryMessage(message) {

const popup =
document.createElement("div");

popup.className =
"memory-popup";

popup.innerHTML = `

<div class="memory-popup-inner">

<div class="popup-icon">
✦
</div>

<h2>
Memory Unlocked
</h2>

<p>
${message}
</p>

<button
onclick="this.closest('.memory-popup').remove()"
>
Continue
</button>

</div>

`;

document.body.appendChild(popup);

}


/* =========================================================
SECRET ENDING
========================================================= */

function showEnding() {

const popup =
document.createElement("div");

popup.className =
"memory-popup";

popup.innerHTML = `

<div class="memory-popup-inner">

<div class="popup-icon">
☾
</div>

<h1>
The Final Memory
</h1>

<p>
You remember the accident.
</p>

<p>
You never woke up in the world
you remembered.
</p>

<p>
The café was waiting for you
on the other side.
</p>

<p>
And your strange little employees?
They were souls waiting to welcome you.
</p>

<h2>
Welcome to the Afterlife Café.
</h2>

<button
onclick="location.href='ghost-cafe.html'"
>
Enter
</button>

</div>

`;

document.body.appendChild(popup);

}


/* =========================================================
CUSTOMER MINI GAME
========================================================= */

const menu = [

{
name: "Golden Hour Latte",
icon: "☕",
reward: 150
},

{
name: "Rainy Day Cocoa",
icon: "🍫",
reward: 200
},

{
name: "Memory Cake",
icon: "🍰",
reward: 250
},

{
name: "Garden Tea",
icon: "🌿",
reward: 175
},

{
name: "Midnight Coffee",
icon: "🌙",
reward: 300
}

];


let currentOrder = null;


function createCustomer() {

currentOrder =
menu[
Math.floor(
Math.random() *
menu.length
)
];


document.getElementById(
"customerOrder"
).innerHTML = `

<div class="customer">

<div class="customer-face">
☺
</div>

<p>
I'd like a
<strong>
${currentOrder.icon}
${currentOrder.name}
</strong>
please!
</p>

</div>

`;


createMenuButtons();

}


function createMenuButtons() {

const container =
document.getElementById(
"menuButtons"
);

container.innerHTML = "";


menu.forEach(item => {

const button =
document.createElement(
"button"
);

button.className =
"menu-item";


button.innerHTML = `

${item.icon}
${item.name}

`;


button.onclick = function() {

if (
item.name ===
currentOrder.name
) {

addCoins(
item.reward
);

createParticles();

alert(
"Correct order! +" +
item.reward +
" coins"
);

createCustomer();

} else {

alert(
"Oops! That's not what they ordered."
);

}

};


container.appendChild(
button
);

});

}


/* =========================================================
PARTICLES
========================================================= */

function createParticles() {

for (
let i = 0;
i < 20;
i++
) {

const particle =
document.createElement(
"div"
);

particle.className =
"memory-particle";

particle.textContent =
"✦";

particle.style.left =
Math.random() * 100 + "vw";

particle.style.top =
Math.random() * 100 + "vh";

document.body.appendChild(
particle
);

setTimeout(
() => particle.remove(),
1500
);

}

}


/* =========================================================
ACCESSORIES
========================================================= */

const accessoryImages = {

flowers:
"images/flowers.png",

bookshelf:
"images/bookshelf.png",

teddy:
"images/teddy.png",

polaroids:
"images/polaroids.png",

plant:
"images/plant.png",

ghostlamp:
"images/ghostlamp.png"

};


function renderAccessories() {

const game = getGame();

const display =
document.getElementById(
"accessoryDisplay"
);

display.innerHTML = "";


game.equippedAccessories
.forEach(id => {

const img =
document.createElement(
"img"
);

img.src =
accessoryImages[id];

img.className =
"cafe-accessory";

img.onerror =
function() {

this.style.display =
"none";

};

display.appendChild(
img
);

});

}


/* =========================================================
THEME
========================================================= */

function applyTheme() {

const game = getGame();

document.body.classList.add(
"theme-" +
game.equippedTheme
);

}


function updateUI() {

const game = getGame();

document
.querySelectorAll(
".coin-count"
)
.forEach(el => {

el.textContent =
game.coins.toLocaleString();

});


document.getElementById(
"memoryCount"
).textContent =
game.memories.length;

}


applyTheme();

renderAccessories();

updateUI();

createCustomer();

</script>
<script>

function applySavedTheme() {

const game =
JSON.parse(
localStorage.getItem(
"soulScrapbookGame"
)
) || {};

const theme =
game.equippedTheme ||
"cozy";

document.body.classList.remove(
"theme-cozy",
"theme-rainy",
"theme-garden",
"theme-vintage",
"theme-midnight",
"theme-afterlife"
);

document.body.classList.add(
"theme-" + theme
);
}

applySavedTheme();

</script>
</body>

</html>
