<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
<h1>🛍️ Café Shop</h1>
<div class="coins">✦ <span class="coin-count">0</span></div>
</header>

<nav class="main-nav">
<a href="index.html">Home</a>
<a href="cafe.html">My Café</a>
<a href="scrapbook.html">Scrapbook</a>
<a href="Shop.html">Shop</a>
<a href="afterlife.html">Truth</a>
</nav>

<main class="page-container">

<h1 class="section-title">Café Themes</h1>
<div class="shop-grid" id="themeShop"></div>

<h1 class="section-title">Accessories</h1>
<div class="shop-grid" id="accessoryShop"></div>

<section class="paper center">
<h2>Your Progress</h2>
<br>
<p>Coins: <strong class="coin-count">0</strong></p>
<br>
<p>Reach <strong>100,000 coins</strong> to discover the secret.</p>
</section>

</main>

<script>

const defaultGame = {
coins: 0,
memories: [],
unlockedThemes: ["cozy"],
ownedAccessories: [],
equippedTheme: "cozy",
equippedAccessories: [],
milestones: [],
afterlifeUnlocked: false
};


/* =========================
GAME DATA
========================= */

function getGame() {

const saved = localStorage.getItem("soulScrapbookGame");

if (saved) {

try {

const oldGame = JSON.parse(saved);

const game = {
...defaultGame,
...oldGame,

memories: Array.isArray(oldGame.memories)
? oldGame.memories
: [],

unlockedThemes: Array.isArray(oldGame.unlockedThemes)
? oldGame.unlockedThemes
: ["cozy"],

ownedAccessories: Array.isArray(oldGame.ownedAccessories)
? oldGame.ownedAccessories
: [],

equippedAccessories: Array.isArray(oldGame.equippedAccessories)
? oldGame.equippedAccessories
: [],

milestones: Array.isArray(oldGame.milestones)
? oldGame.milestones
: [],

equippedTheme: oldGame.equippedTheme || "cozy",

afterlifeUnlocked: oldGame.afterlifeUnlocked || false
};

if (!game.unlockedThemes.includes("cozy")) {
game.unlockedThemes.unshift("cozy");
}

localStorage.setItem(
"soulScrapbookGame",
JSON.stringify(game)
);

return game;

} catch (error) {

localStorage.setItem(
"soulScrapbookGame",
JSON.stringify(defaultGame)
);

return { ...defaultGame };
}
}

localStorage.setItem(
"soulScrapbookGame",
JSON.stringify(defaultGame)
);

return { ...defaultGame };
}


function saveGame(game) {

localStorage.setItem(
"soulScrapbookGame",
JSON.stringify(game)
);
}


/* =========================
THEMES
========================= */

const themes = [

{
id: "cozy",
name: "Cozy Café",
price: 0,
image: "images/cafe.png",
description: "Your original warm café."
},

{
id: "rainy",
name: "Rainy Café",
price: 1000,
image: "images/rainy.png",
description: "Warm lights and rain outside."
},

{
id: "garden",
name: "Garden Café",
price: 3000,
image: "images/garden.png",
description: "Flowers, plants and sunlight."
},

{
id: "vintage",
name: "Vintage Café",
price: 7500,
image: "images/vintage.png",
description: "A café filled with nostalgia."
},

{
id: "midnight",
name: "Midnight Café",
price: 15000,
image: "images/midnight.png",
description: "A quiet café beneath the stars."
},

{
id: "afterlife",
name: "Afterlife Café",
price: 100000,
image: "images/afterlife.png",
description: "The café beyond life.",
secret: true
}

];


/* =========================
ACCESSORIES
========================= */

const accessories = [

{
id: "flowers",
name: "Flower Vase",
price: 300,
image: "images/flowers.png"
},

{
id: "bookshelf",
name: "Tiny Bookshelf",
price: 700,
image: "images/bookshelf.png"
},

{
id: "teddy",
name: "Café Teddy",
price: 1500,
image: "images/teddy.png"
},

{
id: "polaroids",
name: "Polaroid Wall",
price: 1000,
image: "images/polaroids.png"
},

{
id: "plant",
name: "Big Plant",
price: 2000,
image: "images/plant.png"
},

{
id: "ghostlamp",
name: "Ghost Lamp",
price: 5000,
image: "images/ghostlamp.png"
}

];


/* =========================
APPLY THEME
========================= */

function applySavedTheme() {

const game = getGame();

document.body.classList.remove(
"theme-cozy",
"theme-rainy",
"theme-garden",
"theme-vintage",
"theme-midnight",
"theme-afterlife"
);

const theme = game.equippedTheme || "cozy";

document.body.classList.add(
"theme-" + theme
);
}


/* =========================
UPDATE COINS
========================= */

function updateUI() {

const game = getGame();

document
.querySelectorAll(".coin-count")
.forEach(element => {

element.textContent =
game.coins.toLocaleString();

});
}


/* =========================
RENDER THEMES
========================= */

function renderThemes() {

const game = getGame();

const shop =
document.getElementById("themeShop");

shop.innerHTML = "";

themes.forEach(theme => {

const unlocked =
game.unlockedThemes.includes(theme.id);

/* Secret Afterlife Theme */

if (
theme.secret &&
!game.afterlifeUnlocked &&
!unlocked
) {

shop.innerHTML += `

<article class="shop-card locked">

<div class="shop-image">
<span>☾</span>
</div>

<h2>??? Café</h2>

<p>A locked memory.</p>

<div class="price">
🔒 100,000 coins
</div>

<button
class="btn secondary"
disabled
>
Locked
</button>

</article>

`;

return;
}


let buttonText;

if (unlocked) {

buttonText =
game.equippedTheme === theme.id
? "Equipped"
: "Equip";

} else {

buttonText = "Buy";

}


shop.innerHTML += `

<article class="shop-card">

<div class="shop-image">

<img
src="${theme.image}"
alt="${theme.name}"
>

</div>

<h2>${theme.name}</h2>

<p>${theme.description}</p>

<div class="price">

${
unlocked
? "✓ Unlocked"
: "✦ " +
theme.price.toLocaleString() +
" coins"
}

</div>

<button
class="btn"
onclick="themeAction('${theme.id}')"
>
${buttonText}
</button>

</article>

`;

});

}


/* =========================
THEME BUY / EQUIP
========================= */

function themeAction(id) {

const game = getGame();

const theme =
themes.find(item => item.id === id);

if (!theme) return;


/* Already unlocked */

if (game.unlockedThemes.includes(id)) {

game.equippedTheme = id;

if (id === "afterlife") {
game.afterlifeUnlocked = true;
}

saveGame(game);

applySavedTheme();
updateUI();
renderThemes();

return;
}


/* Not enough coins */

if (game.coins < theme.price) {

alert("You don't have enough coins.");

return;
}


/* Buy */

game.coins -= theme.price;

game.unlockedThemes.push(id);

game.equippedTheme = id;


if (id === "afterlife") {
game.afterlifeUnlocked = true;
}


saveGame(game);

applySavedTheme();
updateUI();
renderThemes();

}


/* =========================
RENDER ACCESSORIES
========================= */

function renderAccessories() {

const game = getGame();

const shop =
document.getElementById("accessoryShop");

shop.innerHTML = "";

accessories.forEach(item => {

const owned =
game.ownedAccessories.includes(item.id);

const equipped =
game.equippedAccessories.includes(item.id);


const buttonText = owned
? equipped
? "Unequip"
: "Equip"
: "Buy";


shop.innerHTML += `

<article class="shop-card">

<div class="shop-image">

<img
src="${item.image}"
alt="${item.name}"
>

</div>

<h2>${item.name}</h2>

<div class="price">

${
owned
? "✓ Owned"
: "✦ " +
item.price.toLocaleString() +
" coins"
}

</div>

<button
class="btn"
onclick="accessoryAction('${item.id}')"
>
${buttonText}
</button>

</article>

`;

});

}


/* =========================
ACCESSORY BUY / EQUIP
========================= */

function accessoryAction(id) {

const game = getGame();

const item =
accessories.find(accessory => accessory.id === id);

if (!item) return;


/* Already owned */

if (game.ownedAccessories.includes(id)) {

if (
game.equippedAccessories.includes(id)
) {

game.equippedAccessories =
game.equippedAccessories.filter(
accessoryId => accessoryId !== id
);

} else {

game.equippedAccessories.push(id);

}

saveGame(game);

renderAccessories();

return;
}


/* Not enough coins */

if (game.coins < item.price) {

alert("You don't have enough coins.");

return;
}


/* Buy */

game.coins -= item.price;

game.ownedAccessories.push(id);

game.equippedAccessories.push(id);

saveGame(game);

updateUI();
renderAccessories();

}


/* =========================
START SHOP
========================= */

updateUI();

applySavedTheme();

renderThemes();

renderAccessories();

</script>

</body>
</html>
